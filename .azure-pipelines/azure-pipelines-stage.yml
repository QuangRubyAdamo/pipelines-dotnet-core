# Staging pipeline: code reaches stage by PR from develop. PRs into stage run
# CI only; every push to stage builds, pushes the image to ACR and deploys it to
# the Staging container once the approval on the
# pipelines-dotnet-core-stage Environment is given.
name: $(Date:yyyyMMdd).$(Rev:r)-stage

trigger:
  branches:
    include: [stage]

pr:
  branches:
    include: [stage]

variables:
  - template: templates/variables.yml

stages:
  - stage: Build
    jobs:
      - template: templates/build.yml

  - stage: DeployStaging
    displayName: Deploy Staging
    dependsOn: Build
    # Deploy only real pushes to stage, never PR validation or manual runs of other branches
    condition: >
      and(succeeded(),
          ne(variables['Build.Reason'], 'PullRequest'),
          eq(variables['Build.SourceBranch'], 'refs/heads/stage'))
    jobs:
      - template: templates/deploy-droplet.yml
        parameters:
          environment: pipelines-dotnet-core-stage
          instance: stage
