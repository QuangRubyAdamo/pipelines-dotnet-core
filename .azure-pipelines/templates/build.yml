# CI: scan, build, test, then build the container image. The image is pushed to
# ACR only for real branch pushes; PR runs just prove the Dockerfile still builds.
jobs:
  - job: Build
    displayName: Build, test and image
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self
        fetchDepth: 0   # full history so the secret scan covers every commit

      - task: UseDotNet@2
        displayName: Install .NET SDK $(dotnetVersion)
        inputs:
          packageType: sdk
          version: $(dotnetVersion)

      - script: >
          docker run --rm -v "$(Build.SourcesDirectory):/repo"
          zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --exit-code 1
        displayName: Secret scan (Gitleaks)

      # SAST with the Semgrep C# and OWASP Top 10 rule packs (SQL injection, XSS, etc.).
      # Every finding is printed to the log and kept as SARIF; only ERROR-severity findings
      # fail the build, so WARNING/INFO items are reviewed without blocking merges.
      - script: |
          set -e
          out="$(Agent.TempDirectory)/sast"
          mkdir -p "$out" && chmod 777 "$out"
          docker run --rm -v "$(Build.SourcesDirectory):/src:ro" -v "$out:/out" -w /src \
            semgrep/semgrep:1.95.0 semgrep scan \
            --config p/csharp --config p/owasp-top-ten --metrics=off \
            --json-output=/out/semgrep.json --sarif-output=/out/CodeAnalysisLogs.sarif .
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' "$out/semgrep.json")
          total=$(jq '.results | length' "$out/semgrep.json")
          echo "Semgrep findings: $total total, $errors at ERROR severity"
          if [ "$errors" -gt 0 ]; then
            echo "##vso[task.logissue type=error]Semgrep found $errors ERROR-severity issue(s); see the findings above"
            exit 1
          fi
        displayName: SAST (Semgrep, OWASP Top 10)

      # Name "CodeAnalysisLogs" is what the SARIF SAST Scans Tab extension reads, if installed.
      - task: PublishPipelineArtifact@1
        displayName: Publish SAST report
        condition: succeededOrFailed()
        inputs:
          targetPath: $(Agent.TempDirectory)/sast/CodeAnalysisLogs.sarif
          artifact: CodeAnalysisLogs

      - script: dotnet restore $(project)
        displayName: Restore

      - script: dotnet build $(project) -c Release --no-restore
        displayName: Build

      # Runs every *Tests.csproj in the repo; none exist yet, so this only warns until one is added.
      - script: |
          set -e
          projects=$(find . -name '*Tests.csproj' -not -path '*/bin/*' -not -path '*/obj/*')
          if [ -z "$projects" ]; then
            echo "##vso[task.logissue type=warning]No *Tests.csproj found; unit tests skipped"
            exit 0
          fi
          for p in $projects; do
            dotnet test "$p" -c Release --logger trx --results-directory "$(Agent.TempDirectory)/test-results"
          done
        displayName: Unit tests

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '$(Agent.TempDirectory)/test-results/*.trx'
          failTaskOnMissingResultsFile: false

      - script: |
          dotnet list $(project) package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qE '\b(Critical|High)\b' vulnerable.txt; then
            echo "##vso[task.logissue type=error]NuGet packages with Critical/High vulnerabilities found"
            exit 1
          fi
        displayName: Dependency vulnerability scan

      - task: Docker@2
        displayName: Build image (PR validation)
        condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
        inputs:
          command: build
          repository: $(imageRepository)
          Dockerfile: Dockerfile
          buildContext: .
          tags: $(imageTag)

      - task: Docker@2
        displayName: Build and push $(acrLoginServer)/$(imageRepository):$(imageTag)
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        inputs:
          command: buildAndPush
          containerRegistry: ACRConnection   # service connection names must be literal (resolved at compile time)
          repository: $(imageRepository)
          Dockerfile: Dockerfile
          buildContext: .
          tags: $(imageTag)
