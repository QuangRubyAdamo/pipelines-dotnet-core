# Dev pipeline: PRs into develop run the build only; every push to develop
# builds and deploys automatically to the Dev environment.
name: $(Date:yyyyMMdd).$(Rev:r)-dev

trigger:
  branches:
    include: [develop]

pr:
  branches:
    include: [develop]

stages:
  - stage: Build
    jobs:
      - template: templates/build.yml

  - stage: DeployDev
    displayName: Deploy Dev
    dependsOn: Build
    # Deploy only real pushes to develop, never PR validation or manual runs of other branches
    condition: >
      and(succeeded(),
          ne(variables['Build.Reason'], 'PullRequest'),
          eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - template: templates/deploy-ubuntu.yml
        parameters:
          environment: pipelines-dotnet-core-dev
          instance: dev
