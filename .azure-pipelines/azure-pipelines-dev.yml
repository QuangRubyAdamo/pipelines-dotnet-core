# Dev pipeline: PRs into develop run CI only; every push to develop builds,
# pushes the image to ACR and deploys it to the Dev container on the Droplet.
name: $(Date:yyyyMMdd).$(Rev:r)-dev

trigger:
  branches:
    include: [develop]

pr:
  branches:
    include: [develop]

variables:
  - template: templates/variables.yml

stages:
  - stage: Build
    jobs:
      - template: templates/build.yml

  - stage: DeployDev
    displayName: Deploy Dev
    dependsOn: Build
    # Deploy only real pushes to develop, never PR validation or manual runs of other branches
    condition: >
      and(succeeded(),
          ne(variables['Build.Reason'], 'PullRequest'),
          eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - template: templates/deploy-droplet.yml
        parameters:
          environment: pipelines-dotnet-core-dev
          instance: dev
