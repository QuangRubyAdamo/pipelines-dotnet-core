# OWASP ZAP baseline rule levels (tab-separated: rule id, level, name).
# FAIL = the DAST stage fails if this rule triggers. These headers are set by
# deploy/nginx/security-headers.conf, so a FAIL means they went missing again.
# Rules not listed keep their default level (WARN: reported, not fatal).
10020	FAIL	(Missing Anti-clickjacking Header)
10021	FAIL	(X-Content-Type-Options Header Missing)
10035	FAIL	(Strict-Transport-Security Header Not Set)
10038	FAIL	(Content Security Policy (CSP) Header Not Set)
10063	FAIL	(Permissions Policy Header Not Set)
# Version nag about the scanner image itself, not a finding about the site.
10116	IGNORE	(ZAP is Out of Date)
