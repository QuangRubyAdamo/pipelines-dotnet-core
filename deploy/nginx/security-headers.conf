# Security response headers for the site, added by Nginx in front of the app.
# Install on the Droplet:
#   cp deploy/nginx/security-headers.conf /etc/nginx/snippets/security-headers.conf
#   add  "include snippets/security-headers.conf;"  inside the HTTPS server { } block
#   nginx -t && systemctl reload nginx
# Note: an add_header inside a location { } block replaces these, so keep them at server level.

# Clickjacking: never render this site inside a frame (CSP frame-ancestors covers modern browsers)
add_header X-Frame-Options "DENY" always;
# Stop browsers from guessing content types
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browser features the app does not use
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# HTTPS only for a year; subdomains of adamo.tech are not forced on purpose
add_header Strict-Transport-Security "max-age=31536000" always;
# Isolate the browsing context (Spectre mitigations). Cross-Origin-Embedder-Policy is left out:
# require-corp would block the CDN scripts the layout loads.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Only allow the sources the layout actually uses: own files plus the two CDNs.
# 'unsafe-inline' for scripts is required by the inline CDN-fallback tests and the cookie
# consent script in the views; removing it needs nonces in the app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://stackpath.bootstrapcdn.com; style-src 'self' https://stackpath.bootstrapcdn.com; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
